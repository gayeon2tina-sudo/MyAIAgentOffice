<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Daily HQ — GaYeon Enterprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --mint:#22d3bd;
    --mint-deep:#0e9c86;
    --pink:#ff4f93;
    --pink-deep:#d81b69;
    --yellow:#ffce1f;
    --lavender:#b48bff;
    --grey:#a99bc4;
    --gold:#ffb400;
    --cream:#fff3d6;
    --wall:#6b4a8a;
    --bg:#fff1e0;
    --bg2:#ffe1ee;
    --panel:#fffdf9;
    --panel-2:#fff8ec;
    --panel-3:#ffe9c9;
    --border:#f0c9a0;
    --text:#3a2a4a;
    --text-dim:#7a6690;
    --text-faint:#a495b8;
    --danger:#ef4568;
    --radius:14px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);
    background-attachment:fixed;
    color:var(--text);
    font-family:'VT323', 'Courier New', monospace;
    font-size:18px;
    line-height:1.4;
    min-height:100vh;
    padding-bottom:40px;
  }
  .pixel{ image-rendering:pixelated; image-rendering:-moz-crisp-edges; image-rendering:crisp-edges; }
  button{
    font-family:'VT323','Courier New',monospace; font-size:16px; cursor:pointer;
    border-radius:10px; border:2px solid var(--border); background:var(--panel-3); color:var(--text);
    padding:7px 12px; box-shadow:0 3px 0 var(--border); transition:transform .08s ease, box-shadow .08s ease, background .15s ease;
  }
  button:hover{ background:#ffdca8; }
  button:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--border); }
  button.primary{ background:var(--mint); color:#053e35; border-color:var(--mint-deep); font-weight:bold; box-shadow:0 3px 0 var(--mint-deep); }
  button.primary:hover{ background:#5ee8d4; }
  button.pink{ background:var(--pink); color:#fff; border-color:var(--pink-deep); font-weight:bold; box-shadow:0 3px 0 var(--pink-deep); }
  button.pink:hover{ background:#ff77ac; }
  button.gold{ background:var(--gold); color:#4a2f00; border-color:#c98900; font-weight:bold; box-shadow:0 3px 0 #c98900; }
  button.ghost{ background:transparent; box-shadow:none; }
  button.icon-btn{ padding:4px 8px; font-size:16px; line-height:1; box-shadow:none; }
  select, textarea, input[type=text]{
    font-family:'VT323','Courier New',monospace; font-size:16px;
    background:var(--panel); color:var(--text); border:2px solid var(--border); border-radius:8px; padding:6px 8px;
  }
  textarea{ width:100%; resize:vertical; min-height:90px; }

  header.top{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 20px; border-bottom:4px solid var(--wall);
    background:linear-gradient(180deg, #fff8ec, var(--bg));
    position:sticky; top:0; z-index:20;
  }
  h1.title{
    font-family:'Press Start 2P', monospace; font-size:19px; margin:0;
    background:linear-gradient(90deg, var(--mint-deep), var(--pink));
    -webkit-background-clip:text; background-clip:text; color:transparent; letter-spacing:1px;
  }
  .hud{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .hud-pill{
    display:flex; align-items:center; gap:6px; font-size:14px; font-weight:bold; color:#fff;
    border:2px solid rgba(0,0,0,0.15); border-radius:20px; padding:6px 12px;
    box-shadow:0 3px 0 rgba(0,0,0,0.15);
  }
  .hud-pill.points{ background:linear-gradient(180deg,#ffd54a,var(--gold)); color:#4a2f00; transition:transform .18s ease; }
  .hud-pill.streak{ background:linear-gradient(180deg,#ff8a65,#ff5c3d); }
  .hud-pill.rank{ background:linear-gradient(180deg,#c9a6ff,var(--lavender)); color:#2f2050; }
  .hud-pill .val{ font-family:'Press Start 2P', monospace; font-size:11px; }
  .points-today.bump{ transform:scale(1.15); }

  main{ max-width:1240px; margin:0 auto; padding:16px 16px 60px; }

  .toolbar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }

  .panel-box{ background:var(--panel); border:3px solid var(--border); border-radius:var(--radius); padding:14px; box-shadow:0 4px 0 rgba(107,74,138,0.12); }
  .panel-box h3{ margin:0 0 8px; font-size:16px; color:var(--pink-deep); text-transform:uppercase; letter-spacing:1px; }

  .morning{ margin-bottom:18px; }
  .preview-row{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:6px 4px; border-bottom:1px dashed var(--border); }
  .preview-row span.txt{ flex:1 1 160px; min-width:120px; }
  .leftover-row{ display:flex; align-items:center; gap:8px; padding:4px 0; }
  .leftover-row span{ flex:1; color:var(--text-dim); }
  .star-btn{ background:none; border:none; padding:0 2px; font-size:16px; cursor:pointer; }
  .star-btn.off{ opacity:.35; }
  .del-btn{ background:none; border:none; color:var(--text-faint); font-size:14px; cursor:pointer; padding:0 2px; }
  .del-btn:hover{ color:var(--danger); }

  /* Floor plan */
  .floorplan{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-areas:
      "job cv portfolio hub"
      "backpack budget health hub";
    gap:0;
    border:5px solid var(--wall);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 6px 0 rgba(107,74,138,0.25);
  }
  @media (max-width:900px){
    .floorplan{ grid-template-columns: repeat(2, 1fr);
      grid-template-areas:
        "hub hub"
        "job cv"
        "portfolio backpack"
        "budget health"; }
  }
  @media (max-width:600px){
    .floorplan{ grid-template-columns: 1fr;
      grid-template-areas: "hub" "job" "cv" "portfolio" "backpack" "budget" "health"; }
  }

  .room{
    border:3px solid var(--wall);
    margin:-1.5px;
    display:flex; flex-direction:column;
    position:relative;
    min-height:230px;
  }
  .room[data-cat="job"]{ grid-area:job; }
  .room[data-cat="cv"]{ grid-area:cv; }
  .room[data-cat="portfolio"]{ grid-area:portfolio; }
  .room[data-cat="backpack"]{ grid-area:backpack; }
  .room[data-cat="budget"]{ grid-area:budget; }
  .room[data-cat="health"]{ grid-area:health; }
  .room.hub{ grid-area:hub; border-color:var(--gold); border-width:4px; background:var(--cream); }

  .room-floor{ padding:8px 10px 4px; display:flex; align-items:center; justify-content:space-between; }
  .room-floor h3{ margin:0; font-size:14px; color:#1a1a2e; text-shadow:0 1px 0 rgba(255,255,255,.4); }
  .room-status{ font-size:12px; color:#1a1a2e; opacity:.75; }
  .progress-track{ height:5px; background:rgba(0,0,0,0.15); }
  .progress-fill{ height:100%; width:0%; transition:width .35s ease; }
  .room-scene{ display:flex; justify-content:center; padding:2px 0 0; position:relative; }
  .room-scene canvas{ display:block; width:100%; max-width:280px; height:auto; }
  .room-body{ padding:8px 12px 12px; flex:1; display:flex; flex-direction:column; gap:4px; }
  .task-row{ display:flex; align-items:flex-start; gap:6px; padding:4px 2px; border-bottom:1px solid var(--border); position:relative; }
  .task-row:last-child{ border-bottom:none; }
  .task-row input[type=checkbox]{ width:18px; height:18px; margin-top:2px; accent-color:var(--mint); cursor:pointer; }
  .task-row .task-text{ flex:1; word-break:break-word; }
  .task-row .task-text.done{ text-decoration:line-through; color:var(--text-faint); }
  .empty-msg{ color:var(--text-faint); font-size:14px; padding:6px 2px; }
  .outreach-inline{ font-size:13px; color:var(--text-faint); border-top:1px dashed var(--border); margin-top:6px; padding-top:6px; }
  .outreach-inline .nums{ color:var(--text); font-family:'Press Start 2P', monospace; font-size:11px; }
  .outreach-inline .err{ color:var(--danger); }

  .hub-body{ padding:8px 12px 12px; flex:1; display:flex; flex-direction:column; gap:8px; color:#2a2010; }
  .hub-body h3{ color:#2a2010; }
  .rank-line{ font-family:'Press Start 2P', monospace; font-size:11px; color:#8a5a00; }
  .streak-line{ font-size:15px; }
  .hub-buttons{ display:flex; gap:6px; flex-wrap:wrap; }

  .sparkle{ position:absolute; left:22px; top:0; font-size:16px; pointer-events:none; animation:sparkleUp .55s ease-out forwards; color:var(--pink-deep); font-weight:bold; }
  @keyframes sparkleUp{
    0%{ opacity:1; transform:translateY(0) scale(0.7); }
    40%{ opacity:1; transform:translateY(-10px) scale(1.15); }
    100%{ opacity:0; transform:translateY(-26px) scale(0.9); }
  }
  .rankup-toast{
    position:fixed; top:76px; left:50%; transform:translateX(-50%);
    background:linear-gradient(135deg,#ffd54a,#ff8fc0);
    border:4px solid #fff; border-radius:16px; padding:14px 28px; text-align:center;
    box-shadow:0 8px 0 rgba(0,0,0,0.15); z-index:100; pointer-events:none;
    animation: rankupPop 2.8s ease forwards;
  }
  .rankup-title{ font-family:'Press Start 2P',monospace; font-size:14px; color:#fff; text-shadow:0 2px 0 rgba(0,0,0,0.2); }
  .rankup-rank{ font-size:22px; color:#3a2a4a; margin-top:6px; font-weight:bold; }
  @keyframes rankupPop{
    0%{ opacity:0; transform:translateX(-50%) translateY(-20px) scale(0.8); }
    10%{ opacity:1; transform:translateX(-50%) translateY(0) scale(1.06); }
    18%{ transform:translateX(-50%) translateY(0) scale(1); }
    85%{ opacity:1; }
    100%{ opacity:0; transform:translateX(-50%) translateY(-10px) scale(0.95); }
  }
  .flavor-toast{
    position:absolute; bottom:2px; left:2%; right:2%; background:rgba(20,15,34,0.92); color:var(--mint);
    font-size:13px; padding:4px 8px; border-radius:6px; border:1px solid var(--mint);
    animation:flavorFade 2.4s ease forwards; pointer-events:none; z-index:5;
  }
  @keyframes flavorFade{
    0%{ opacity:0; transform:translateY(4px); }
    12%{ opacity:1; transform:translateY(0); }
    80%{ opacity:1; }
    100%{ opacity:0; }
  }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(58,42,74,0.55); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .modal{ background:var(--panel); border:4px solid var(--pink); border-radius:16px; max-width:640px; width:100%; max-height:85vh; overflow-y:auto; padding:18px 20px; box-shadow:0 8px 0 rgba(107,74,138,0.3); }
  .modal h2{ margin-top:0; color:var(--pink-deep); font-size:18px; }
  .modal .close-x{ float:right; }
  .stat-row{ display:flex; gap:14px; flex-wrap:wrap; margin:10px 0 16px; }
  .stat-tile{ background:var(--panel-2); border:2px solid var(--border); border-radius:8px; padding:10px 14px; min-width:100px; text-align:center; }
  .stat-tile .num{ font-family:'Press Start 2P', monospace; font-size:18px; color:var(--pink); }
  .stat-tile .lbl{ font-size:12px; color:var(--text-dim); margin-top:4px; }
  .review-list{ list-style:none; padding:0; margin:6px 0 16px; }
  .review-list li{ padding:3px 0; border-bottom:1px dashed var(--border); }
  .review-list li.unchecked{ color:var(--text-faint); }
  .cat-tag{ font-size:12px; color:var(--text-faint); margin-left:6px; }
  .note-area{ width:100%; min-height:70px; margin-top:6px; }
  .trend-bar-wrap{ margin:10px 0; }
  .trend-bar-row{ display:flex; align-items:center; gap:8px; margin:6px 0; }
  .trend-bar-row .bar-label{ width:90px; font-size:13px; color:var(--text-dim); }
  .trend-bar-track{ flex:1; background:var(--panel-2); border-radius:4px; height:16px; overflow:hidden; border:1px solid var(--border); }
  .trend-bar-fill{ height:100%; border-radius:4px; }
  .trend-bar-row .bar-val{ width:40px; text-align:right; font-size:14px; }
  .cat-breakdown-row{ display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dashed var(--border); }
  .nudge-box{ background:rgba(255,224,102,0.10); border:2px dashed var(--yellow); border-radius:8px; padding:10px; margin:10px 0; }
  .nudge-box .dismiss{ float:right; }
  .goal-card{ background:var(--panel-2); border:2px solid var(--border); border-radius:8px; padding:10px; margin-bottom:10px; }
  .goal-card label{ display:block; font-size:13px; color:var(--text-dim); margin:6px 0 2px; }
  .goal-card input[type=text], .goal-card textarea{ width:100%; }
  .trophy-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:8px; }
  .trophy-item{ background:var(--panel-2); border:2px solid var(--gold); border-radius:8px; padding:8px; font-size:13px; }
  .trophy-item .t-date{ color:var(--text-faint); font-size:11px; }

  .hidden{ display:none !important; }
  .footer-note{ text-align:center; color:var(--text-faint); font-size:13px; margin-top:28px; }
</style>
</head>
<body>

<header class="top">
  <h1 class="title">GAYEON ENTERPRISE</h1>
  <div class="hud">
    <span class="hud-pill points" id="pointsPill">🪙 <span class="val" id="pointsVal">0</span></span>
    <span class="hud-pill streak" id="streakPill">🔥 <span class="val" id="streakVal">0</span></span>
    <span class="hud-pill rank" id="rankPill">🏆 <span class="val" id="rankVal">Intern</span></span>
  </div>
</header>

<main>
  <div class="toolbar">
    <button id="goalsBtn">🎯 Goals</button>
    <button id="dailyReviewBtn">📋 Daily Review</button>
    <button id="weeklyReviewBtn">📈 Weekly Review</button>
    <button id="trophyBtn">🏆 Trophy Shelf</button>
    <button id="exportBtn">⬇ Export my data</button>
  </div>

  <section class="morning panel-box">
    <h3>This morning</h3>
    <textarea id="taskInput" placeholder="Type today's tasks, one per line...&#10;e.g. Review today's leads&#10;30 min run&#10;Draft backpack post idea"></textarea>
    <div style="margin-top:8px; display:flex; gap:8px;">
      <button class="primary" id="previewBtn">Preview tasks →</button>
      <button class="ghost" id="clearInputBtn">Clear</button>
    </div>
    <div id="previewList" style="margin-top:10px;"></div>
    <div id="confirmRow" class="hidden" style="margin-top:8px;">
      <button class="pink" id="confirmAddBtn">Add to today's list</button>
    </div>
    <div id="leftoverBox" class="hidden" style="margin-top:16px;">
      <h3>From yesterday (unchecked)</h3>
      <div id="leftoverList"></div>
    </div>
  </section>

  <section class="floorplan" id="floorplan"></section>

  <p class="footer-note">Data lives only in this browser (localStorage). Export regularly if you don't want to depend on one browser.</p>
</main>

<div id="modalRoot"></div>

<script>
(function(){
  "use strict";

  /* ===================== Config ===================== */

  var CATEGORIES = [
    { id:'job', name:'Job Search', icon:'🎯', floor:'#6ff5df', accent:'#0aab8c',
      lead:'Scout', member:'Radar',
      flavors:["Scout found one.", "Radar's tracking a lead."],
      cursor:'<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 20 20"><circle cx="8" cy="8" r="6" fill="none" stroke="%23222" stroke-width="2"/><line x1="13" y1="13" x2="18" y2="18" stroke="%23222" stroke-width="2"/></svg>',
      keywords:['job','jobs','posting','postings','role','roles','shortlist','linkedin','indeed','recruiter','apply for','pm role','pmm role','opening','openings','lead','leads'] },
    { id:'cv', name:'CV & Applications', icon:'📝', floor:'#ff9dc4', accent:'#e0397e',
      lead:'Editor', member:'Wordsmith',
      flavors:["Editor stamped it.", "Wordsmith's letting that rest before the final pass."],
      cursor:'<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 20 20"><rect x="4" y="10" width="12" height="7" rx="1" fill="%23c93c81" stroke="%23222" stroke-width="1"/><rect x="7" y="4" width="6" height="6" fill="%23c93c81" stroke="%23222" stroke-width="1"/></svg>',
      keywords:['cv','resume','résumé','cover letter','tailor','application draft','submit application','cover ltr'] },
    { id:'portfolio', name:'Portfolio Site', icon:'🖼️', floor:'#c9aeff', accent:'#7c4fe0',
      lead:'Builder', member:'Pixel',
      flavors:["Builder added a beam.", "Pixel touched up a section."],
      cursor:'<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 20 20"><rect x="9" y="2" width="2" height="12" fill="%238a5a2b"/><rect x="3" y="1" width="10" height="5" rx="1" fill="%236b4fc9" stroke="%23222" stroke-width="1"/></svg>',
      keywords:['portfolio','webflow','lovable','site','website','page copy','landing page'] },
    { id:'backpack', name:'Backpack Content', icon:'🎒', floor:'#ffd27a', accent:'#e0821f',
      lead:'Storyteller', member:'Spark',
      flavors:["Spark lit up with an idea.", "Echo double checked, all clear."],
      cursor:'<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 20 20"><path d="M3 17 L14 3 Q17 2 16 5 L6 16 Q4 18 3 17 Z" fill="%23c97a2b" stroke="%23222" stroke-width="1"/></svg>',
      keywords:['backpack','blog','post idea','content','draft post','newsletter','write about','write a post'] },
    { id:'budget', name:'Budget & Life', icon:'💰', floor:'#a3e8ae', accent:'#2f9e56',
      lead:'Ledger', member:'Coin',
      flavors:["Ledger tucked that away.", "Coin counted it twice."],
      cursor:'<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="%23ffe066" stroke="%238a6a1a" stroke-width="1.5"/><text x="10" y="14" font-size="8" text-anchor="middle" fill="%238a6a1a">%24</text></svg>',
      keywords:['budget','runway','rent','lease','seattle','move','moving','expenses','savings','spreadsheet','bank'] },
    { id:'health', name:'Health', icon:'🏃', floor:'#8fd6ff', accent:'#1f8fe0',
      lead:'Stride', member:'Breeze',
      flavors:["Stride logged today's run.", "Breeze says nice pace today."],
      cursor:'<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 20 20"><path d="M3 17 Q3 3 17 3 Q17 17 3 17 Z" fill="%234fae7a" stroke="%232b7fc9" stroke-width="1"/><line x1="4" y1="16" x2="15" y2="5" stroke="%232b7fc9" stroke-width="1"/></svg>',
      keywords:['run','running','yoga','workout','gym','walk','stretch','exercise','swim','bike','pilates','lift'] }
  ];
  var CAT_BY_ID = {};
  CATEGORIES.forEach(function(c){ CAT_BY_ID[c.id] = c; });

  var RANKS = [
    { title:'Intern', min:0 },
    { title:'Associate', min:15 },
    { title:'Senior Associate', min:40 },
    { title:'Team Lead', min:80 },
    { title:'Director', min:150 },
    { title:'Co-Founder', min:260 },
    { title:'CEO of GaYeon Enterprise', min:400 }
  ];

  var GOAL_DEFAULTS = [
    { id:'goal1', name:'Land the role', tag:'Job Search', onTrack:'', categories:['job','cv'] },
    { id:'goal2', name:'Personal brand is live', tag:'Portfolio & Content', onTrack:'', categories:['portfolio','backpack'] },
    { id:'goal3', name:'Financially steady through the transition', tag:'Budget & Life', onTrack:'', categories:['budget'] }
  ];

  var OUTREACH_SHEET_ID = '1tcm4mRBQOAwXR1e96_oG2ZQm8j8VN1oSaA6KOzQFIGc';
  var OUTREACH_TAB = 'Outreach Tracker';
  var OUTREACH_NOT_SENT_STATUSES = ['not contacted', ''];
  var OUTREACH_REPLIED_STATUSES = ['replied', 'scheduled', 'met'];

  var STORAGE_PREFIX = 'dailyhq:';
  var DAY_KEY = function(d){ return STORAGE_PREFIX + 'day:' + d; };
  var RECURRING_KEY = STORAGE_PREFIX + 'recurring';
  var META_KEY = STORAGE_PREFIX + 'meta';
  var MECH_KEY = STORAGE_PREFIX + 'mechanics';
  var GOALS_KEY = STORAGE_PREFIX + 'goals';

  /* ===================== Date helpers ===================== */

  function dateStr(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function todayStr(){ return dateStr(new Date()); }
  function addDays(dStr, delta){
    var p = dStr.split('-').map(Number);
    var d = new Date(p[0], p[1]-1, p[2]);
    d.setDate(d.getDate() + delta);
    return dateStr(d);
  }
  function prettyDate(dStr){
    var p = dStr.split('-').map(Number);
    var d = new Date(p[0], p[1]-1, p[2]);
    return d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
  }

  /* ===================== Storage ===================== */

  function safeParse(raw, fallback){
    if(!raw) return fallback;
    try{ return JSON.parse(raw); } catch(e){ return fallback; }
  }
  function defaultDay(d){ return { date:d, tasks:[], outreach:{}, note:'', reviewed:false }; }
  function loadDay(d){
    var day = safeParse(localStorage.getItem(DAY_KEY(d)), null);
    if(!day) return defaultDay(d);
    if(!Array.isArray(day.tasks)) day.tasks = [];
    if(typeof day.note !== 'string') day.note = '';
    if(typeof day.reviewed !== 'boolean') day.reviewed = false;
    return day;
  }
  function saveDay(day){ localStorage.setItem(DAY_KEY(day.date), JSON.stringify(day)); }

  function loadRecurring(){ return safeParse(localStorage.getItem(RECURRING_KEY), []); }
  function saveRecurring(list){ localStorage.setItem(RECURRING_KEY, JSON.stringify(list)); }

  function loadMeta(){ return safeParse(localStorage.getItem(META_KEY), { lastOpenedDate:null }); }
  function saveMeta(meta){ localStorage.setItem(META_KEY, JSON.stringify(meta)); }

  function loadMechanics(){ return safeParse(localStorage.getItem(MECH_KEY), { portfolioGrowth:0, budgetFill:0 }); }
  function saveMechanics(m){ localStorage.setItem(MECH_KEY, JSON.stringify(m)); }

  function loadGoals(){ return safeParse(localStorage.getItem(GOALS_KEY), null); }
  function saveGoals(g){ localStorage.setItem(GOALS_KEY, JSON.stringify(g)); }

  function allDayDates(){
    var out = [];
    for(var i=0;i<localStorage.length;i++){
      var key = localStorage.key(i);
      if(key.indexOf(STORAGE_PREFIX + 'day:') === 0) out.push(key.slice((STORAGE_PREFIX+'day:').length));
    }
    return out.sort();
  }

  function makeId(prefix){ return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7); }

  /* ===================== Category detection ===================== */

  function detectCategory(text){
    var lower = text.toLowerCase();
    var best = '', bestScore = 0;
    CATEGORIES.forEach(function(cat){
      var score = 0;
      cat.keywords.forEach(function(kw){ if(lower.indexOf(kw) !== -1) score++; });
      if(score > bestScore){ bestScore = score; best = cat.id; }
    });
    return best;
  }
  function escapeHtml(s){
    return s.replace(/[&<>"']/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; });
  }

  /* ===================== App state ===================== */

  var today = todayStr();
  var currentDay = loadDay(today);
  var mechanics = loadMechanics();
  var pendingPreview = [];
  var outreachData = { ok:false, loading:true };

  function totalPointsToday(){ return currentDay.tasks.filter(function(t){ return t.done; }).length; }
  function totalPointsAllTime(){
    var sum = 0;
    allDayDates().forEach(function(d){ sum += loadDay(d).tasks.filter(function(t){ return t.done; }).length; });
    return sum;
  }
  function weekDates(endDateStr, count){
    var arr = []; for(var i=0;i<count;i++) arr.push(addDays(endDateStr, -i));
    return arr;
  }
  function currentRank(points){
    var r = RANKS[0];
    RANKS.forEach(function(rk){ if(points >= rk.min) r = rk; });
    return r;
  }
  function nextRank(points){
    for(var i=0;i<RANKS.length;i++){ if(RANKS[i].min > points) return RANKS[i]; }
    return null;
  }
  function computeStreak(){
    var d = today;
    var t = loadDay(today);
    if(!t.tasks.some(function(x){ return x.done; })) d = addDays(today,-1);
    var streak = 0;
    while(true){
      var day = loadDay(d);
      if(day.tasks.filter(function(x){ return x.done; }).length > 0){ streak++; d = addDays(d,-1); }
      else break;
    }
    return streak;
  }

  /* ===================== Recurring + rollover ===================== */

  function applyRecurring(){
    var recurring = loadRecurring().filter(function(r){ return r.active; });
    var changed = false;
    recurring.forEach(function(tpl){
      var exists = currentDay.tasks.some(function(t){ return t.recurringId === tpl.id; });
      if(!exists){
        currentDay.tasks.push({ id: makeId('t'), text: tpl.text, category: tpl.category, done:false, milestone:false, recurringId: tpl.id, createdAt: Date.now() });
        changed = true;
      }
    });
    if(changed) saveDay(currentDay);
  }

  function initDayRollover(){
    var meta = loadMeta();
    if(meta.lastOpenedDate && meta.lastOpenedDate !== today){
      var prevDay = loadDay(meta.lastOpenedDate);
      if(prevDay.tasks.length > 0 && !prevDay.reviewed){
        openDailyReview(meta.lastOpenedDate, true);
        prevDay.reviewed = true;
        saveDay(prevDay);
      }
    }
    meta.lastOpenedDate = today;
    saveMeta(meta);
  }

  /* ===================== Goals ===================== */

  function ensureGoals(){
    var g = loadGoals();
    if(!g){
      g = GOAL_DEFAULTS.map(function(d){ return Object.assign({}, d); });
      saveGoals(g);
      return { goals:g, firstRun:true };
    }
    return { goals:g, firstRun:false };
  }

  function checkGoalNudges(goals){
    var cutoff = addDays(today, -14);
    var dates = allDayDates();
    return goals.map(function(g){
      var lastDate = null;
      dates.forEach(function(d){
        var day = loadDay(d);
        day.tasks.forEach(function(t){
          if(t.done && g.categories.indexOf(t.category) !== -1){
            if(!lastDate || d > lastDate) lastDate = d;
          }
        });
      });
      var stale = !lastDate || lastDate < cutoff;
      return { goal:g, stale:stale, lastDate:lastDate };
    }).filter(function(r){ return r.stale; });
  }

  function lastActivityForGoal(g){
    var last = null;
    allDayDates().forEach(function(d){
      loadDay(d).tasks.forEach(function(t){
        if(t.done && g.categories.indexOf(t.category) !== -1){ if(!last || d > last) last = d; }
      });
    });
    return last;
  }

  /* ===================== Outreach (live sheet read) ===================== */

  function outreachGvizUrl(){
    return 'https://docs.google.com/spreadsheets/d/' + OUTREACH_SHEET_ID + '/gviz/tq?tqx=out:json&sheet=' + encodeURIComponent(OUTREACH_TAB);
  }

  function fetchOutreach(){
    outreachData = { ok:false, loading:true };
    renderOutreachInline();
    fetch(outreachGvizUrl()).then(function(res){
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    }).then(function(text){
      var start = text.indexOf('{');
      var end = text.lastIndexOf('}');
      if(start === -1 || end === -1) throw new Error('Unexpected response — sheet may not be shared yet.');
      var data = JSON.parse(text.substring(start, end+1));
      var cols = data.table.cols.map(function(c){ return (c.label||'').toLowerCase(); });
      var statusIdx = cols.findIndex(function(c){ return c.indexOf('status') !== -1 && c.indexOf('scheduled') === -1 && c.indexOf('met') === -1; });
      if(statusIdx === -1) throw new Error('Could not find a Status column in that sheet.');
      var sent = 0, replied = 0, total = 0;
      (data.table.rows||[]).forEach(function(row){
        var cell = row.c && row.c[statusIdx];
        var status = (cell && cell.v ? String(cell.v) : '').trim().toLowerCase();
        if(!status) return;
        total++;
        if(OUTREACH_NOT_SENT_STATUSES.indexOf(status) === -1) sent++;
        if(OUTREACH_REPLIED_STATUSES.indexOf(status) !== -1) replied++;
      });
      outreachData = { ok:true, loading:false, sent:sent, replied:replied, total:total };
      renderOutreachInline();
    }).catch(function(err){
      outreachData = { ok:false, loading:false, error: err.message };
      renderOutreachInline();
    });
  }

  function renderOutreachInline(){
    var el = document.getElementById('outreachInline');
    if(!el) return;
    if(outreachData.loading){ el.innerHTML = 'Loading outreach numbers…'; return; }
    if(!outreachData.ok){
      el.innerHTML = '<span class="err">Couldn\'t load the outreach sheet: ' + escapeHtml(outreachData.error||'unknown error') + '</span><br>' +
        'Make sure "LETS_GET_THIS_BREAD" → Outreach Tracker is shared as "Anyone with the link – Viewer." ' +
        '<button class="icon-btn" id="retryOutreachBtn" style="margin-top:4px;">Retry</button>';
      var btn = document.getElementById('retryOutreachBtn');
      if(btn) btn.addEventListener('click', fetchOutreach);
      return;
    }
    el.innerHTML = 'Outreach — <span class="nums">Sent ' + outreachData.sent + '</span> · <span class="nums">Replied ' + outreachData.replied + '</span> ' +
      '<button class="icon-btn" id="retryOutreachBtn" style="margin-left:6px;">🔄</button>';
    var btn = document.getElementById('retryOutreachBtn');
    if(btn) btn.addEventListener('click', fetchOutreach);
  }

  /* ===================== Sprites & scenes ===================== */

  function roundRectPath(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function drawChibi(ctx, cx, cy, s, bodyColor, earColor, opts){
    opts = opts || {};
    var headR = 7*s, bodyW = 11*s, bodyH = 7*s;
    ctx.fillStyle = 'rgba(0,0,0,0.14)';
    ctx.beginPath(); ctx.ellipse(cx, cy+headR*1.65, bodyW*0.55, 2.2*s, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = bodyColor;
    roundRectPath(ctx, cx-bodyW/2, cy+headR*0.55, bodyW, bodyH, 3*s); ctx.fill();
    ctx.fillStyle = earColor;
    ctx.beginPath(); ctx.arc(cx-headR*0.75, cy-headR*0.75, headR*0.38, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+headR*0.75, cy-headR*0.75, headR*0.38, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff8ee';
    ctx.beginPath(); ctx.arc(cx, cy, headR, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,110,145,0.55)';
    ctx.beginPath(); ctx.ellipse(cx-headR*0.55, cy+headR*0.22, headR*0.22, headR*0.13, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+headR*0.55, cy+headR*0.22, headR*0.22, headR*0.13, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2a2038'; ctx.strokeStyle = '#2a2038'; ctx.lineWidth = Math.max(1, s*0.8);
    if(opts.happy){
      ctx.beginPath(); ctx.arc(cx-headR*0.32, cy-headR*0.02, headR*0.17, Math.PI, 0); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx+headR*0.32, cy-headR*0.02, headR*0.17, Math.PI, 0); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(cx-headR*0.32, cy-headR*0.02, headR*0.15, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+headR*0.32, cy-headR*0.02, headR*0.15, 0, Math.PI*2); ctx.fill();
    }
  }

  function roomHasTasks(catId){ return tasksForCategory(catId).length > 0; }
  function roomAllDone(catId){ var t = tasksForCategory(catId); return t.length > 0 && t.every(function(x){ return x.done; }); }

  var sceneState = {};
  CATEGORIES.forEach(function(c){ sceneState[c.id] = { leadX: 8, leadDir: 1, memX: 50, memDir: -1 }; });

  function drawWall(ctx, w){ ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.fillRect(0,0,w,4); }

  function drawDesk(ctx, x, y){
    ctx.fillStyle = '#5b4636'; ctx.fillRect(x, y, 26, 14);
    ctx.fillStyle = '#3d2e22'; ctx.fillRect(x, y, 26, 3);
  }

  function drawProps(ctx, catId){
    switch(catId){
      case 'job':
        ctx.fillStyle = '#8a7256'; ctx.fillRect(6, 30, 14, 20);
        ctx.fillStyle = '#5b4636'; ctx.fillRect(6, 35, 14, 2); ctx.fillRect(6, 42, 14, 2);
        ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(120, 14, 6, 0, Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(124,18); ctx.lineTo(130,24); ctx.stroke();
        break;
      case 'cv':
        ctx.fillStyle = '#c93c81'; ctx.fillRect(8, 38, 10, 6);
        ctx.fillStyle = '#8a2a58'; ctx.fillRect(11, 32, 4, 6);
        ctx.fillStyle = '#b08a5a'; ctx.fillRect(6, 12, 16, 18);
        ctx.fillStyle = '#8a6a3a'; ctx.fillRect(6, 18, 16, 2); ctx.fillRect(6, 24, 16, 2);
        break;
      case 'backpack':
        ctx.fillStyle = '#8a5a2b'; ctx.fillRect(6, 14, 18, 4);
        ['#ff6b9d','#5eead4','#ffe066'].forEach(function(col, i){ ctx.fillStyle = col; ctx.fillRect(8 + i*6, 18, 4, 6); });
        ctx.fillStyle = '#c97a2b'; ctx.fillRect(8, 36, 12, 10);
        ctx.fillStyle = '#a55f1e'; ctx.fillRect(8, 40, 12, 1);
        break;
      case 'health':
        ctx.fillStyle = '#e08a5a'; ctx.fillRect(6, 40, 20, 8);
        ctx.fillStyle = '#3f8f5b'; ctx.fillRect(120, 30, 3, 16);
        ctx.beginPath(); ctx.fillStyle = '#4fae7a'; ctx.arc(121, 28, 8, 0, Math.PI*2); ctx.fill();
        break;
    }
  }

  function drawPortfolioStructure(ctx){
    var floors = Math.min(6, Math.floor(mechanics.portfolioGrowth/3));
    var baseX = 10, baseY = 56, w = 34;
    ctx.fillStyle = '#6b4fc9'; ctx.fillRect(baseX, baseY-6, w, 6);
    for(var i=0;i<floors;i++){
      var fy = baseY - 6 - (i+1)*8;
      ctx.fillStyle = i % 2 === 0 ? '#8a72d9' : '#7460cf';
      ctx.fillRect(baseX, fy, w, 8);
      ctx.fillStyle = '#ffe066';
      ctx.fillRect(baseX+5, fy+2, 4, 4);
      ctx.fillRect(baseX+w-9, fy+2, 4, 4);
    }
  }

  function drawBudgetJar(ctx){
    var jx = 10, jy = 20, jw = 20, jh = 34;
    ctx.strokeStyle = '#3f8f5b'; ctx.lineWidth = 2;
    ctx.strokeRect(jx, jy, jw, jh);
    var fill = Math.min(1, mechanics.budgetFill/15);
    var fillH = jh * fill;
    var grad = ctx.createLinearGradient(0, jy+jh-fillH, 0, jy+jh);
    grad.addColorStop(0, '#5eead4'); grad.addColorStop(1, '#3f8f5b');
    ctx.fillStyle = grad;
    ctx.fillRect(jx+2, jy+jh-fillH, jw-4, fillH-2 > 0 ? fillH-2 : 0);
    ctx.fillStyle = '#ffe066';
    ctx.fillRect(120, 40, 12, 4); ctx.fillRect(122, 36, 8, 4); ctx.fillRect(124, 32, 4, 4);
  }

  function drawRoomScene(catId, tick){
    var canvas = document.querySelector('.room[data-cat="'+catId+'"] canvas');
    if(!canvas) return;
    var ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    var cat = CAT_BY_ID[catId];
    ctx.fillStyle = cat.floor; ctx.fillRect(0,0,canvas.width, canvas.height);
    drawWall(ctx, canvas.width);
    drawProps(ctx, catId);
    if(catId === 'portfolio') drawPortfolioStructure(ctx);
    if(catId === 'budget') drawBudgetJar(ctx);
    drawDesk(ctx, canvas.width-30, 40);

    var hasTasks = roomHasTasks(catId);
    var allDone = roomAllDone(catId);
    var scale = 1.7;

    if(!hasTasks){
      drawChibi(ctx, canvas.width-26, 30, scale*0.9, cat.accent, shade(cat.accent), {});
      return;
    }
    if(allDone){
      var grad = ctx.createRadialGradient(canvas.width-20, 34, 2, canvas.width-20, 34, 26);
      grad.addColorStop(0, 'rgba(255,214,80,0.55)'); grad.addColorStop(1, 'rgba(255,214,80,0)');
      ctx.fillStyle = grad; ctx.fillRect(canvas.width-48, 8, 48, 50);
      drawChibi(ctx, canvas.width-30, 36, scale, cat.accent, shade(cat.accent), { happy:true });
      drawChibi(ctx, canvas.width-13, 38, scale*0.82, shade(cat.accent), cat.accent, { happy:true });
      ctx.font = '13px sans-serif'; ctx.fillText('⭐', canvas.width-32, 12);
      return;
    }
    var st = sceneState[catId];
    var minX = 34, maxX = canvas.width - 30;
    st.leadX += st.leadDir * 0.5; if(st.leadX>maxX){st.leadX=maxX; st.leadDir=-1;} if(st.leadX<minX){st.leadX=minX; st.leadDir=1;}
    st.memX += st.memDir * 0.35; if(st.memX>maxX){st.memX=maxX; st.memDir=-1;} if(st.memX<minX){st.memX=minX; st.memDir=1;}
    var leadBounce = Math.abs(Math.sin(tick/6)) * 2.2;
    var memBounce = Math.abs(Math.sin(tick/7 + 1)) * 2.2;
    drawChibi(ctx, st.leadX, 34-leadBounce, scale, cat.accent, shade(cat.accent), {});
    drawChibi(ctx, st.memX, 36-memBounce, scale*0.82, shade(cat.accent), cat.accent, {});
  }
  function shade(hex){
    var n = parseInt(hex.slice(1),16);
    var r = Math.min(255,(n>>16)+40), g = Math.min(255,((n>>8)&255)+40), b = Math.min(255,(n&255)+40);
    return 'rgb('+r+','+g+','+b+')';
  }

  function drawHubScene(tick){
    var canvas = document.querySelector('[data-role="hubcanvas"]');
    if(!canvas) return;
    var ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#f5e6c8'; ctx.fillRect(0,0,canvas.width, canvas.height);
    drawWall(ctx, canvas.width);
    drawDesk(ctx, canvas.width-30, 40);
    var bob = Math.abs(Math.sin(tick/10)) * 2.2;
    drawChibi(ctx, canvas.width-26, 30-bob, 1.9, '#ffb400', '#ff8a3d', { happy:true });
    ctx.font = '16px monospace'; ctx.fillText('🔥', 10, 20);
    ctx.font = 'bold 12px monospace'; ctx.fillStyle = '#8a5a00';
    ctx.fillText(String(computeStreak()), 30, 20);
  }

  var animTick = 0, lastFrameTime = 0;
  function isNarrow(){ return window.matchMedia('(max-width:600px)').matches; }
  function animLoop(ts){
    var interval = isNarrow() ? 220 : 90;
    if(ts - lastFrameTime >= interval){
      lastFrameTime = ts; animTick++;
      if(document.visibilityState === 'visible'){
        CATEGORIES.forEach(function(c){ drawRoomScene(c.id, animTick); });
        drawHubScene(animTick);
      }
    }
    requestAnimationFrame(animLoop);
  }

  function renderHubBody(){
    var points = totalPointsAllTime();
    var rank = currentRank(points);
    var next = nextRank(points);
    document.getElementById('hubRankLine').textContent = rank.title + (next ? ' → ' + (next.min-points) + ' pts to ' + next.title : ' (top rank!)');
    document.getElementById('hubStreakLine').textContent = '🔥 ' + computeStreak() + ' day streak';
  }

  document.getElementById('trophyBtn').addEventListener('click', openTrophyShelf);
  function openTrophyShelf(){
    var trophies = [];
    allDayDates().forEach(function(d){
      loadDay(d).tasks.forEach(function(t){
        if(t.milestone && t.done) trophies.push({ text:t.text, category:t.category, date:d });
      });
    });
    trophies.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    var html = '' +
      '<div class="modal-backdrop" id="trophyBackdrop">' +
        '<div class="modal">' +
          '<button class="close-x icon-btn" id="closeTrophyModal">✕</button>' +
          '<h2>🏆 Trophy Shelf</h2>' +
          (trophies.length ? '<div class="trophy-grid">' + trophies.map(function(t){
            var cat = CAT_BY_ID[t.category];
            return '<div class="trophy-item">⭐ ' + escapeHtml(t.text) + '<div class="t-date">' + (cat?cat.icon+' '+cat.name+' · ':'') + prettyDate(t.date) + '</div></div>';
          }).join('') + '</div>' : '<p style="color:var(--text-faint);">No milestones yet — star a task when you add or check it off.</p>') +
        '</div>' +
      '</div>';
    document.getElementById('modalRoot').innerHTML = html;
    document.getElementById('closeTrophyModal').addEventListener('click', closeModal);
    document.getElementById('trophyBackdrop').addEventListener('click', function(e){ if(e.target.id==='trophyBackdrop') closeModal(); });
  }

  /* ===================== Daily review ===================== */

  function goalNudgeHtml(){
    var state = ensureGoals();
    var nudges = checkGoalNudges(state.goals);
    if(nudges.length === 0) return '';
    return nudges.map(function(n){
      return '<div class="nudge-box">' +
        '<button class="del-btn dismiss" data-role="dismissNudge">✕</button>' +
        '"' + escapeHtml(n.goal.name) + '" hasn\'t had a checked-off item in a while' + (n.lastDate ? ' (last: ' + prettyDate(n.lastDate) + ')' : ' (none yet)') + ' — want to adjust it? ' +
        '<button class="icon-btn" id="editGoalsFromNudge">Edit goals</button>' +
      '</div>';
    }).join('');
  }
  function wireNudgeButtons(){
    document.querySelectorAll('[data-role="dismissNudge"]').forEach(function(btn){
      btn.addEventListener('click', function(){ btn.closest('.nudge-box').remove(); });
    });
    var editBtn = document.getElementById('editGoalsFromNudge');
    if(editBtn) editBtn.addEventListener('click', function(){ closeModal(); openGoalsModal(); });
  }

  function openDailyReview(dateStrArg, autoTriggered){
    var day = loadDay(dateStrArg);
    var done = day.tasks.filter(function(t){ return t.done; });
    var undone = day.tasks.filter(function(t){ return !t.done; });
    var html = '' +
      '<div class="modal-backdrop" id="dailyModalBackdrop">' +
        '<div class="modal">' +
          '<button class="close-x icon-btn" id="closeDailyModal">✕</button>' +
          '<h2>Daily Review — '+prettyDate(dateStrArg)+(autoTriggered?' (auto)':'')+'</h2>' +
          '<div class="stat-row">' +
            '<div class="stat-tile"><div class="num">'+done.length+'</div><div class="lbl">total points</div></div>' +
            '<div class="stat-tile"><div class="num">'+done.length+'</div><div class="lbl">items checked</div></div>' +
            '<div class="stat-tile"><div class="num">'+undone.length+'</div><div class="lbl">not checked</div></div>' +
          '</div>' +
          goalNudgeHtml() +
          '<h3 style="color:var(--mint);">Done</h3>' +
          '<ul class="review-list">' + (done.length ? done.map(function(t){ var cat=CAT_BY_ID[t.category]; return '<li>'+(t.milestone?'⭐ ':'')+escapeHtml(t.text)+' <span class="cat-tag">'+(cat?cat.icon+' '+cat.name:'')+'</span></li>'; }).join('') : '<li class="unchecked">Nothing checked off.</li>') + '</ul>' +
          '<h3 style="color:var(--text-faint);">Not checked off</h3>' +
          '<ul class="review-list">' + (undone.length ? undone.map(function(t){ var cat=CAT_BY_ID[t.category]; return '<li class="unchecked">'+(t.milestone?'⭐ ':'')+escapeHtml(t.text)+' <span class="cat-tag">'+(cat?cat.icon+' '+cat.name:'')+'</span></li>'; }).join('') : '<li>Everything on the list got done.</li>') + '</ul>' +
          '<h3>Your note</h3>' +
          '<textarea class="note-area" id="dailyNoteArea" placeholder="What would you do differently? (your words, not mine)">'+escapeHtml(day.note||'')+'</textarea>' +
          '<div style="margin-top:10px; text-align:right;"><button class="primary" id="saveDailyNoteBtn">Save note & close</button></div>' +
        '</div>' +
      '</div>';
    document.getElementById('modalRoot').innerHTML = html;
    wireNudgeButtons();
    document.getElementById('closeDailyModal').addEventListener('click', closeModal);
    document.getElementById('dailyModalBackdrop').addEventListener('click', function(e){ if(e.target.id==='dailyModalBackdrop') closeModal(); });
    document.getElementById('saveDailyNoteBtn').addEventListener('click', function(){
      var d = loadDay(dateStrArg); d.note = document.getElementById('dailyNoteArea').value; saveDay(d); closeModal();
    });
  }
  document.getElementById('dailyReviewBtn').addEventListener('click', function(){ openDailyReview(today, false); });

  /* ===================== Weekly review ===================== */

  function openWeeklyReview(){
    var thisWeekDates = weekDates(today, 7);
    var lastWeekDates = weekDates(addDays(today,-7), 7);
    function summarize(dates){
      var points=0, sent=0, replied=0;
      var catCounts = {}; CATEGORIES.forEach(function(c){ catCounts[c.id]=0; });
      var milestones = [];
      dates.forEach(function(d){
        var day = loadDay(d);
        day.tasks.forEach(function(t){
          if(t.done){ points++; catCounts[t.category]=(catCounts[t.category]||0)+1; if(t.milestone) milestones.push({text:t.text, category:t.category, date:d}); }
        });
      });
      return { points:points, catCounts:catCounts, milestones:milestones };
    }
    var thisWeek = summarize(thisWeekDates), lastWeek = summarize(lastWeekDates);
    var maxPts = Math.max(thisWeek.points, lastWeek.points, 1);
    var delta = thisWeek.points - lastWeek.points;
    var deltaTxt = delta===0 ? 'no change vs last week' : (delta>0 ? '+'+delta+' vs last week' : delta+' vs last week');
    var catRows = CATEGORIES.map(function(c){ return '<div class="cat-breakdown-row"><span>'+c.icon+' '+c.name+'</span><span>'+thisWeek.catCounts[c.id]+'</span></div>'; }).join('');
    var milestoneList = thisWeek.milestones.length ? thisWeek.milestones.map(function(m){ var cat=CAT_BY_ID[m.category]; return '<li>⭐ '+escapeHtml(m.text)+' <span class="cat-tag">'+(cat?cat.icon+' '+cat.name:'')+' · '+prettyDate(m.date)+'</span></li>'; }).join('') : '<li class="unchecked">No milestones checked off this week.</li>';
    var outreachSentTxt = outreachData.ok ? outreachData.sent : '—';
    var outreachRepliedTxt = outreachData.ok ? outreachData.replied : '—';
    var html = '' +
      '<div class="modal-backdrop" id="weeklyModalBackdrop">' +
        '<div class="modal">' +
          '<button class="close-x icon-btn" id="closeWeeklyModal">✕</button>' +
          '<h2>Weekly Review — '+prettyDate(thisWeekDates[6])+' to '+prettyDate(thisWeekDates[0])+'</h2>' +
          '<div class="stat-row">' +
            '<div class="stat-tile"><div class="num">'+thisWeek.points+'</div><div class="lbl">total points</div></div>' +
            '<div class="stat-tile"><div class="num">'+outreachSentTxt+'</div><div class="lbl">outreach sent (current)</div></div>' +
            '<div class="stat-tile"><div class="num">'+outreachRepliedTxt+'</div><div class="lbl">replied (current)</div></div>' +
          '</div>' +
          goalNudgeHtml() +
          '<h3>Per-room points</h3>' + catRows +
          '<h3 style="margin-top:14px;">Trend</h3>' +
          '<div class="trend-bar-wrap">' +
            '<div class="trend-bar-row"><span class="bar-label">This week</span><div class="trend-bar-track"><div class="trend-bar-fill" style="width:'+(thisWeek.points/maxPts*100)+'%; background:var(--mint);"></div></div><span class="bar-val">'+thisWeek.points+'</span></div>' +
            '<div class="trend-bar-row"><span class="bar-label">Last week</span><div class="trend-bar-track"><div class="trend-bar-fill" style="width:'+(lastWeek.points/maxPts*100)+'%; background:var(--grey);"></div></div><span class="bar-val">'+lastWeek.points+'</span></div>' +
          '</div>' +
          '<p style="color:var(--text-dim); font-size:14px;">'+deltaTxt+'</p>' +
          '<h3>Milestones this week</h3><ul class="review-list">'+milestoneList+'</ul>' +
        '</div>' +
      '</div>';
    document.getElementById('modalRoot').innerHTML = html;
    wireNudgeButtons();
    document.getElementById('closeWeeklyModal').addEventListener('click', closeModal);
    document.getElementById('weeklyModalBackdrop').addEventListener('click', function(e){ if(e.target.id==='weeklyModalBackdrop') closeModal(); });
  }
  document.getElementById('weeklyReviewBtn').addEventListener('click', openWeeklyReview);

  /* ===================== Export ===================== */

  function exportData(){
    var out = { days:{}, recurring: loadRecurring(), meta: loadMeta(), mechanics: loadMechanics(), goals: loadGoals(), exportedAt: new Date().toISOString() };
    allDayDates().forEach(function(d){ out.days[d] = loadDay(d); });
    var blob = new Blob([JSON.stringify(out, null, 2)], { type:'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = 'dailyhq-export-' + today + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  }
  document.getElementById('exportBtn').addEventListener('click', exportData);

  /* ===================== Master render ===================== */

  function renderAll(){
    renderHUD();
    renderPreview();
    renderLeftovers();
    renderAllRoomTasks();
    renderHubBody();
  }

  /* ===================== Boot ===================== */

  buildFloorplan();
  initDayRollover();
  currentDay = loadDay(today);
  applyRecurring();
  currentDay = loadDay(today);
  var goalState = ensureGoals();
  renderAll();
  fetchOutreach();
  requestAnimationFrame(animLoop);
  if(goalState.firstRun) openGoalsModal();

})();
</script>
</body>
</html>
